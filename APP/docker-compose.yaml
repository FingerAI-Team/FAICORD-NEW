services:
  app:
    container_name: faicord-nonvmilus
    image: faicord:nonmilvus
    build:
      context: .
      dockerfile: Dockerfile
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - .:/faicord 
    stdin_open: true
    tty: true
    command: bash